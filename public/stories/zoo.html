<!DOCTYPE html><html><body style="margin:0;background:#789"><canvas id="c" width="1500" height="900"></canvas>
<script src="../three.min.js"></script><script>THREE.ColorManagement.enabled=false;</script><script src="critters.js"></script>
<script>
const r=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true,preserveDrawingBuffer:true});r.outputColorSpace=THREE.LinearSRGBColorSpace;r.shadowMap.enabled=true;r.shadowMap.type=THREE.PCFSoftShadowMap;
const sc=new THREE.Scene();sc.background=new THREE.Color(0xbfd8c8);const cam=new THREE.PerspectiveCamera(30,1500/900,.1,100);
const q=new URLSearchParams(location.search);const ang=+(q.get('a')||.5);const D=+(q.get("d")||13);cam.position.set(Math.sin(ang)*D,D*.22,Math.cos(ang)*D);cam.lookAt(0,+(q.get("y")||.6),0);
sc.add(new THREE.HemisphereLight(0xfff1d6,0x6f7c44,1.1));const sun=new THREE.DirectionalLight(0xfff0c4,2.6);sun.position.set(5,9,6);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-9,right:9,top:9,bottom:-9});sc.add(sun);
const g=new THREE.Mesh(new THREE.PlaneGeometry(40,40),new THREE.MeshLambertMaterial({color:0x8fb36a}));g.rotation.x=-Math.PI/2;g.receiveShadow=true;sc.add(g);
const names=(q.get('n')||'vinca,fox,raccoon,deer,duck,frog,turtle,fish,angler,isopod,dumbo,human').split(',');const sp=+(q.get('sp')||0);
const cs=names.map((n,i)=>{const c=n==='buck'?Critter.deer({antlers:1,coat:0xb9824e}):Critter[n]();c.g.position.set((i-(names.length-1)/2)*(+(q.get('gap')||1.6)),0,i%2?-.8:.8);c.g.rotation.y=+(q.get('ry')||.4);sc.add(c.g);return c;});
let t=0;window.step=(n,st)=>{for(let i=0;i<n;i++){t+=1/60;cs.forEach(c=>c.anim(1/60,t,Object.assign({speed:sp},st||{})));}r.render(sc,cam);};step(+(q.get('f')||90));window.ready=1;
</script></body></html>
